name: Quality CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  full-test-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev extras
        run: pip install -e ".[dev]"
      - name: pytest
        run: pytest -ra

  visual-regression-gate:
    runs-on: ubuntu-latest
    needs: full-test-suite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev extras
        run: pip install -e ".[dev]"
      - name: Run visual regression check
        run: python scripts/visual_regression.py

  perf-regression-gate:
    runs-on: ubuntu-latest
    needs: full-test-suite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev extras
        run: pip install -e ".[dev]"
      - name: Run performance regression gate
        run: python scripts/perf_regression_gate.py

  quality-dashboard:
    runs-on: ubuntu-latest
    needs: [visual-regression-gate, perf-regression-gate]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev extras
        run: pip install -e ".[dev]"
      - name: Generate quality dashboard
        run: python scripts/quality_dashboard.py --no-log
