networks:
  harita-net:
    driver: bridge

volumes:
  harita-data:
    driver: local
  harita-db-data:
    driver: local

services:
  # --------------------------------------------------------------------- #
  # Uygulama — mevcut Dockerfile (Faz 18 tek-tenant app_shell sunucusu).
  # --------------------------------------------------------------------- #
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: harita-modelleme:latest
    restart: unless-stopped
    expose:
      - "8765"
    environment:
      HARITA_REGISTRY_PATH: /home/harita/.harita/registry.hprojreg
      # GÜNCEL DURUM (roadmap Faz 5.2): persistence/postgres_backend.py
      # artık gerçek bir PostgreSQL+PostGIS backend'i sağlıyor
      # (PostgresProjectDatabase - aynı ProjectDatabase API yüzeyi +
      # query_bbox coğrafi sorgusu), 12 offline test yeşil. DÜRÜST
      # SINIRLAMA: `persistence.ProjectManager` (ve dolayısıyla
      # `app_shell`) şu an hâlâ SADECE `db_backend.ProjectDatabase`
      # (SQLite) kullanıyor - bu env değişkeni burada gelecekteki
      # ProjectManager çoklu-backend seçimi için hazır bırakıldı, bugün
      # app_shell tarafından okunmuyor.
      DATABASE_URL: ""
    volumes:
      - harita-data:/home/harita/.harita
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=2).status==200 else 1)"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - harita-net

  # --------------------------------------------------------------------- #
  # Ters vekil (reverse proxy) — dış dünyaya açılan tek nokta, TLS
  # sonlandırma ve statik dosya/istek sınırlama burada yapılır.
  # --------------------------------------------------------------------- #
  reverse-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/harita.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - harita-net

  # --------------------------------------------------------------------- #
  # GÜNCEL DURUM: Roadmap Faz 5.2'nin istediği PostgreSQL+PostGIS backend
  # kodu artık yazılmış ve test edilmiş (persistence/postgres_backend.py,
  # PostgresProjectDatabase). Bu servis compose'da hazır ama
  # `profiles: [future-postgres]` ile varsayılan `docker-compose up`
  # akışına dahil EDİLMEZ, çünkü `ProjectManager`/`app_shell` henüz bu
  # backend'e YÖNLENDİRİLMEDİ (hâlâ sabit olarak SQLite kullanıyor) —
  # etkinleştirmek isteyen kendi kodunda `PostgresProjectDatabase.create()`
  # ile doğrudan kullanabilir. Etkinleştirmek için:
  #   docker compose --profile future-postgres up
  db:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    profiles: ["future-postgres"]
    environment:
      POSTGRES_DB: harita
      POSTGRES_USER: harita
      POSTGRES_PASSWORD_FILE: /run/secrets/harita_db_password
    secrets:
      - harita_db_password
    volumes:
      - harita-db-data:/var/lib/postgresql/data
    networks:
      - harita-net

secrets:
  harita_db_password:
    file: ./deploy/secrets/harita_db_password.txt
