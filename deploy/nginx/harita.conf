# Roadmap Faz 5.5 — üretim ters vekili (reverse proxy).
# Rate limiting burada (Faz 5.4'ün ikinci katmanı — app_shell içindeki
# SlidingWindowRateLimiter'a EK olarak, kaba/ucuz bir dış katman).

limit_req_zone $binary_remote_addr zone=harita_api:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    location /api/ {
        limit_req zone=harita_api burst=20 nodelay;

        proxy_pass http://app:8765/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket köprüsü (extensibility/websocket_api.py) için upgrade başlıkları.
    location /ws/ {
        proxy_pass http://app:8765/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://app:8765/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
